# ============================================================================
# Velluma CI
# ----------------------------------------------------------------------------
# 后端: py_compile 语法检查(零额外依赖,稳定)
# 前端: TypeScript 类型检查(vue-tsc,非阻断 —— 现有代码库存在既有类型问题,
#       作为进度报告,待修复后可改为阻断)
# ============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同一分支的并发运行取消旧批次,节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 后端:Python 语法检查
  # --------------------------------------------------------------------------
  backend-check:
    name: Backend (py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile-check backend
        run: python -m compileall -q backend/

      # 阻断:启动编排三份实现(win ps1 / macos sh / python 监督者)共用同一套端口段与
      # electron npm script 契约,历史上飘过(前端扫描上界 5274/5275/5285 三版并存)。
      # 契约常量、为何不能共享代码、以及漂移后的修法见 scripts/check_launcher_contract.py
      - name: Launcher contract check
        run: python scripts/check_launcher_contract.py

      # 非阻断:统计缺 AGPL SPDX 头的在役 py 文件数,防缺口再生(批量补齐见 scripts/add_license_headers.py)
      - name: License header check (non-blocking)
        run: |
          missing=$(find backend -name '*.py' -not -path 'backend/_deprecated/*' -print0 | xargs -0 grep -L "SPDX-License-Identifier: AGPL" | wc -l)
          echo "缺 SPDX 头的在役 py 文件数: $missing"
          if [ "$missing" -gt 0 ]; then
            echo "::warning::发现 $missing 个在役 py 文件缺 AGPL-3.0 SPDX 头"
          fi

  # --------------------------------------------------------------------------
  # 前端:TypeScript 类型检查(非阻断)
  # --------------------------------------------------------------------------
  frontend-typecheck:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    # 现有代码库存在既有类型错误,设为非阻断:作为进度报告,不阻断 PR
    # 待类型问题修复后,移除 continue-on-error 即可转为阻断检查
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck
