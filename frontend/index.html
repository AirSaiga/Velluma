<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velluma AI 小说写作助手</title>
    <script>
      /* 外观防闪闸（docs/design/theme-system/01-theme-architecture.md §1.3）
         ⚠ 对拍契约：逻辑与 src/composables/useAppearance.ts 的 parseAppearance/applyAppearance 同源，
         改一边必须改另一边。刻意豁免：纸纹（texture）背景不在此应用——颗粒晚一帧不可感知，
         避免两份长 data-URI 漂移；--paper-texture 纸面淡剂量变体同此豁免。失败静默 = paper 浅档。 */
      ;(function () {
        try {
          var theme = 'paper'
          var mode = 'system'
          var bg = null
          var motionLow = false
          var raw = null
          try { raw = localStorage.getItem('velluma:appearance:v1') } catch (e) {}
          if (raw) {
            try {
              var a = JSON.parse(raw)
              if (a && typeof a.theme === 'string') theme = a.theme
              if (a && (a.mode === 'light' || a.mode === 'dark' || a.mode === 'system')) mode = a.mode
              if (a && a.bg) bg = a.bg
              if (a && a.motionLow === true) motionLow = true
            } catch (e) {}
          } else {
            try {
              var legacy = localStorage.getItem('velluma_theme')
              if (legacy === 'dark' || legacy === 'light') mode = legacy
            } catch (e) {}
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var de = document.documentElement
          de.dataset.theme = theme
          de.classList.toggle('dark', dark)
          if (bg && (bg.kind === 'color' || bg.kind === 'image')) {
            var veil = typeof bg.veil === 'number' ? Math.min(0.8, Math.max(0, bg.veil)) : 0.55
            de.style.setProperty('--user-bg-veil', dark ? 'rgba(0,0,0,' + veil + ')' : 'rgba(255,255,255,' + veil + ')')
            if (bg.kind === 'color' && typeof bg.color === 'string') {
              de.style.setProperty('--user-bg-color', bg.color)
            } else if (bg.kind === 'image' && typeof bg.dataUrl === 'string') {
              de.style.setProperty('--user-bg-image', bg.dataUrl)
            }
          }
          if (motionLow) de.classList.add('motion-low')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
